<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Matcher</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    .card {
      border: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      background: #fff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
    }
    .card-header {
      background: linear-gradient(135deg, #007bff, #00c6ff);
      color: white;
      text-align: center;
      padding: 25px;
    }
    .card-header h2 {
      margin: 0;
      font-weight: 600;
      font-size: 1.8rem;
    }
    .card-body {
      padding: 30px;
    }
    .form-group label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }
    .form-control {
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 15px;
      border: 1px solid #ddd;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
    }
    textarea {
      resize: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #007bff, #00c6ff);
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 30px;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0056b3, #0096c7);
      transform: scale(1.05);
    }
    .alert {
      border-radius: 12px;
      font-size: 15px;
    }
    ul li {
      padding: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2>Job Description and Resume Matcher</h2>
      </div>
      <div class="card-body">
        <form method="POST" action="/matcher" enctype="multipart/form-data">
          <div class="form-group">
            <label for="job_description">Job Description:</label>
            <textarea class="form-control" id="job_description" name="job_description" rows="5" required></textarea>
          </div>
          <div class="form-group">
            <label for="resumes">Upload Resumes:</label>
            <p class="text-muted">Please upload at least 5 resumes in PDF, DOCX, or TXT format.</p>
            <input type="file" class="form-control" id="resumes" name="resumes" multiple required accept=".pdf, .docx, .txt">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Match Resumes</button>
        </form>

        {% if message %}
          <div class="alert alert-info mt-4">
            <p>{{ message }}</p>
            <ul>
              {% for index in range(top_resumes|length) %}
                <li>{{ top_resumes[index] }} (Similarity Score: {{ similarity_scores[index] }})</li>
              {% endfor %}
            </ul>
          </div>
        {% endif %}
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
